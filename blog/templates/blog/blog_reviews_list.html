{% extends 'blog/base.html' %}

{% block title %}Лента{% endblock %}

{% block content %}
{% for review in blog_reviews%}
<ul class="list-group">
  <li class="list-group-item d-flex justify-content-between align-items-center">
    <a href="{% url 'blog:blog_review_detail' review.pk %}">{{review.title}}</a>
    <span class="badge text-bg-primary rounded-pill">Просмотры: {{review.see_counter}}</span>
  </li>
</ul>
{% endfor %}
{% endblock %}
